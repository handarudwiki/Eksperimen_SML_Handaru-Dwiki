name: CI - Model Training

on:
  push:
    branches: [main]
    paths:
      - "preprocessing/**"
      - "nama_dataset_raw/**"
      - "requirements.txt"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Commit & push training artifacts (Skilled)
        run: |
          python preprocessing/automate_Handaru-Dwiki.py \
            --input nama_dataset_raw/telco_customer_churn_raw.csv \
            --output preprocessing/telco_customer_churn_preprocessing
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add preprocessing/telco_customer_churn_preprocessing/train.csv preprocessing/telco_customer_churn_preprocessing/test.csv
          git diff --cached --quiet || git commit -m "chore: update training artifacts [skip ci]"
          git push
